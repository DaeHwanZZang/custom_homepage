<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --surface-2: #f0eee6;
    --ink: #3d3929;
    --ink-soft: #83827c;
    --line: rgba(61, 57, 41, 0.12);
    --accent: #d97757;
    --accent-strong: #c15f3c;
    --accent-soft: rgba(217, 119, 87, 0.1);
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(61, 57, 41, 0.04), 0 8px 24px rgba(61, 57, 41, 0.06);
  }
  :root[data-theme="dark"] {
    --bg: #262624;
    --surface: #30302e;
    --surface-2: #3a3a37;
    --ink: #ececea;
    --ink-soft: #a3a29c;
    --line: rgba(236, 236, 234, 0.1);
    --accent: #d97757;
    --accent-strong: #e08a6c;
    --accent-soft: rgba(217, 119, 87, 0.14);
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    transition: background 0.4s, color 0.4s;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 9vh 24px 64px;
  }

  .corner-btn {
    position: fixed;
    right: 20px;
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.2s, border-color 0.2s;
  }
  .corner-btn:hover { color: var(--accent); border-color: var(--accent); }
  .back-btn { top: 20px; }
  .theme-btn { top: 68px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  h1 {
    font-family: ui-serif, "New York", Georgia, serif;
    font-size: 1.7rem;
    font-weight: 500;
  }
  #clearBtn {
    border: none;
    background: none;
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--accent-strong);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  #clearBtn:hover { background: var(--accent-soft); }

  .list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    text-decoration: none;
    color: var(--ink);
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--accent-soft); }

  .row .icon {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    overflow: hidden;
  }
  .row .icon img { width: 20px; height: 20px; object-fit: contain; }
  .row .icon.mono {
    font-family: ui-serif, "New York", Georgia, serif;
    font-size: 0.95rem;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--accent-strong);
  }

  .row .info { flex: 1; min-width: 0; }
  .row .name {
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .url {
    font-size: 0.78rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .time {
    flex: none;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <a class="corner-btn back-btn" href="index.html" title="Back to home" aria-label="Back to home">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <button class="corner-btn theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>

  <div class="wrap">
    <header>
      <h1>History</h1>
      <button id="clearBtn" type="button">Clear history</button>
    </header>
    <div class="list" id="list"></div>
  </div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  /* ---------- Theme (shared with home page) ---------- */
  var theme = load("hp.theme", null);
  function applyTheme() {
    var dark = theme === "dark" ||
      (theme === null && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  }
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  $("themeBtn").addEventListener("click", function () {
    var dark = document.documentElement.dataset.theme === "dark";
    theme = dark ? "light" : "dark";
    save("hp.theme", theme);
    applyTheme();
  });

  /* ---------- Icon helper (mirrors home page) ---------- */
  function makeIcon(name, url) {
    var host = "";
    try { host = new URL(url).hostname; } catch (e) {}

    var icon = document.createElement("span");
    icon.className = "icon";

    function showMonogram() {
      icon.className = "icon mono";
      icon.innerHTML = "";
      icon.textContent = name.charAt(0).toUpperCase();
    }

    if (host) {
      var img = document.createElement("img");
      img.alt = "";

      var faviconUrl = function (h) {
        return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(h) + "&sz=64";
      };
      var MIN_TRUSTED_SIZE = 32;
      var altHost = host.indexOf("www.") === 0 ? host.slice(4) : "www." + host;
      var triedAlt = false;
      function tryAlt() {
        if (triedAlt) { showMonogram(); return; }
        triedAlt = true;
        img.src = faviconUrl(altHost);
      }
      img.addEventListener("error", tryAlt);
      img.addEventListener("load", function () {
        if (img.naturalWidth < MIN_TRUSTED_SIZE) tryAlt();
      });

      img.src = faviconUrl(host);
      icon.appendChild(img);
    } else {
      showMonogram();
    }
    return icon;
  }

  function formatTime(ts) {
    var diff = Date.now() - ts;
    var min = Math.floor(diff / 60000);
    if (min < 1) return "just now";
    if (min < 60) return min + "m ago";
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + "h ago";
    var d = new Date(ts);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function render() {
    var history = load("hp.history", []);
    var list = $("list");
    list.innerHTML = "";

    if (history.length === 0) {
      list.innerHTML = "";
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No history yet — sites you visit from the home page will show up here.";
      list.appendChild(empty);
      return;
    }

    history.forEach(function (entry) {
      var row = document.createElement("a");
      row.className = "row";
      row.href = entry.url;

      row.appendChild(makeIcon(entry.name, entry.url));

      var info = document.createElement("span");
      info.className = "info";

      var name = document.createElement("span");
      name.className = "name";
      name.textContent = entry.name;
      info.appendChild(name);

      var urlLine = document.createElement("span");
      urlLine.className = "url";
      urlLine.textContent = entry.url;
      info.appendChild(document.createElement("br"));
      info.appendChild(urlLine);

      row.appendChild(info);

      var time = document.createElement("span");
      time.className = "time";
      time.textContent = formatTime(entry.time);
      row.appendChild(time);

      list.appendChild(row);
    });
  }
  render();

  $("clearBtn").addEventListener("click", function () {
    if (!confirm("Clear all history?")) return;
    save("hp.history", []);
    render();
  });
})();
</script>
</body>
</html>
